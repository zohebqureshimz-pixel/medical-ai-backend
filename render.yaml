services:
  - type: web
    name: medical-ai-backend
    env: docker
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medical-ai-db
          property: connectionString

databases:
  - name: medical-ai-db
    plan: free
